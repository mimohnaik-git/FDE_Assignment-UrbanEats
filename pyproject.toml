[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "urbaneats"
version = "0.2.0"
description = "Placement-time operations intelligence runtime"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
    # Upstream compatibility warnings in the accepted dependency baseline only.
    # \x3a matches SciPy's colon without becoming a pytest filter separator.
    'ignore:^Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.$:starlette.exceptions.StarletteDeprecationWarning:^fastapi\.testclient$',
    'ignore:^scipy\.optimize\x3a The `disp` and `iprint` options of the L-BFGS-B solver are deprecated and will be removed in SciPy 1\.18\.0\.$:DeprecationWarning:^sklearn\.linear_model\._logistic$',
]

[tool.ruff]
extend-exclude = ["UrbanEats_classifier_langchain.ipynb", "UrbanEats_profiling_gx.ipynb", "notebooks/original"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
